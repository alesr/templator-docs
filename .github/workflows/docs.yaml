name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual deploy of any branch, so docs changes can be previewed live
  # before merging (Settings → Pages serves them at the site URL).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  # Build the Starlight site. Link validation fails the build on broken
  # internal links.
  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # lastUpdated dates come from git history; a shallow clone would
          # report CI dates.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install docs dependencies
        run: npm ci

      - name: Build docs (includes link validation)
        run: npm run build

  # Deploy the built site to GitHub Pages on push to main.
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [docs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Same as the build job: lastUpdated dates come from git history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install docs dependencies
        run: npm ci

      - name: Build docs
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
